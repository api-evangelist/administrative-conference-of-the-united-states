pricing_model: none
pricing_url: null
signup_required: false
api_key_required: false
evidence:
  - url: https://www.acus.gov/
    status: 200
    finding: >-
      No pricing, plans, subscribe, sign-up or developer link anywhere in the site
      navigation or footer. Footer links are agency governance and content pages only.
  - url: https://www.acus.gov/data
    status: 200
    finding: >-
      The agency's data page describes its Evidence Act obligations and names a Chief
      Data Officer. No paid data product, no API key, no terms of use for data.
  - url: https://eaja.acus.gov/
    status: 200
    finding: Open public database UI, no account, no paywall.
  - url: https://sourcebook.acus.gov/api.php?action=query&meta=siteinfo&format=json
    status: 200
    finding: Live API answers anonymously with no credential and no billing surface.
note: >-
  A federal agency with no charge model is a legitimate plan_count of 0, not a gap. This
  file exists so the zero is recorded as a measured fact with method and evidence rather
  than being inferred from an absent file.
