description: >-
  ACUS publishes nothing for sale and no API plans. It is an independent federal agency
  funded by congressional appropriation; its recommendations, reports, the Federal
  Administrative Procedure Sourcebook, the EAJA Awards Database and the Federal
  Administrative Adjudication Database are all free to the public with no account, no
  key, no tier and no quota. This artifact replaces a 2026-05-04 bulk-sweep scaffold that
  asserted Free / Professional / Enterprise tiers with request quotas, overage pricing,
  SLAs and webhook subscriptions — none of which exist.
plan_count: 0
