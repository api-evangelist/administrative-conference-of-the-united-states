  authentication: authentication/administrative-conference-of-the-united-states-authentication.yml
  lifecycle: lifecycle/administrative-conference-of-the-united-states-lifecycle.yml
  rate_limits: rate-limits/administrative-conference-of-the-united-states-rate-limits.yml
  conformance: conformance/administrative-conference-of-the-united-states-conformance.yml
