generated: '2026-08-30'
method: probed
source: >-
  https://www.acus.gov/ (footer + policy pages), https://www.acus.gov/rss.xml,
  https://sourcebook.acus.gov/api.php?action=query&meta=siteinfo, and response-header
  inspection on sourcebook.acus.gov, all 2026-08-30
provider: Administrative Conference of the United States
providerId: administrative-conference-of-the-united-states
description: >-
  Lifecycle posture for the Administrative Conference of the United States. ACUS runs no
  developer program, so there is no API versioning policy, no deprecation policy, no SLA
  and no status page. What lifecycle signal exists is editorial rather than technical:
  the agency publishes dated recommendations, reports, news releases and a monthly
  Updates in Federal Agency Adjudication, and it exposes a site-wide RSS feed.
versioning:
  policy_published: false
  scheme: >-
    Inherited from MediaWiki. The REST surface is path-versioned at /rest.php/v1/; the
    Action API is unversioned and evolves with the MediaWiki release the wiki runs.
  current_platform_version: MediaWiki 1.43.0
  evidence: >-
    https://sourcebook.acus.gov/api.php?action=query&meta=siteinfo&format=json returns
    generator "MediaWiki 1.43.0", phpversion 8.3.30, git-branch master.
  note: >-
    MediaWiki 1.43 is an LTS release. ACUS makes no commitment of its own about when it
    will move off it, and there is no announcement channel for the wiki.
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  evidence: >-
    No Deprecation or Sunset (RFC 8594) headers observed on any probed response from
    sourcebook.acus.gov. No deprecation page exists on www.acus.gov.
  note: >-
    NO Deprecation pointer is emitted in apis.yml — the policy does not exist. Upstream
    MediaWiki emits deprecation notices in the Action API `warnings` envelope, but that
    is MediaWiki's lifecycle, not ACUS's.
