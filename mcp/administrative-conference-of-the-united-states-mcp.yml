description: >-
  ACUS publishes no MCP server, hosted or local. This file records that absence and
  sketches the tool surface an MCP server over the Federal Administrative Procedure
  Sourcebook API would expose, derived strictly from operations verified live. NO
  MCPServer pointer is emitted in apis.yml, because emitting one would assert an agent
  surface the agency does not ship.
