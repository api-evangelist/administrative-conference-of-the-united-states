  verified: derived
  note: >-
    Searched for a hosted or packaged ACUS MCP server: no llms.txt on any acus.gov host
    (404), no /mcp or /sse endpoint advertised anywhere, no npm or PyPI package
    (registry search returned 0 results), no ACUS GitHub organization
