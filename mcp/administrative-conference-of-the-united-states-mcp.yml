candidate_tools:
  - name: search_sourcebook
    description: Full-text search the Federal Administrative Procedure Sourcebook.
    backing_operation: GET /rest.php/v1/search/page?q={q}&limit={limit}
    verified: true
    confidence: high
  - name: find_sourcebook_entry
    description: Find a Sourcebook entry by title prefix.
    backing_operation: GET /rest.php/v1/search/title?q={q}&limit={limit}
    verified: true
    confidence: high
  - name: get_sourcebook_entry
    description: >-
      Retrieve one Sourcebook entry — a federal administrative-procedure statute or
      doctrine page — with its wikitext source and latest revision pointer.
    backing_operation: GET /rest.php/v1/page/{title}
    verified: true
    confidence: high
  - name: get_sourcebook_entry_html
    description: Retrieve the rendered HTML of a Sourcebook entry.
    backing_operation: GET /rest.php/v1/page/{title}/html
    verified: true
    confidence: high
  - name: list_sourcebook_entries
    description: Enumerate every entry in the Sourcebook, with continuation.
    backing_operation: GET /api.php?action=query&list=allpages&aplimit={limit}
    verified: true
    confidence: high
  - name: get_sourcebook_revision
    description: Retrieve a specific revision of a Sourcebook entry.
    backing_operation: GET /rest.php/v1/revision/{id}/bare
    verified: true
    confidence: high
agent_blockers:
  - >-
    Any such server would have to send a browser User-Agent. Every acus.gov host returns
    HTTP 403 to curl, python-requests and GPTBot; only a desktop browser UA gets 200
    (measured 2026-08-30).
  - >-
    The corpus is 21 content articles. It is small enough that a full local copy is more
    practical than a live tool surface, and it changes rarely.
corpus_note: >-
  Verified entries as of 2026-08-30 include the Administrative Procedure Act, Freedom of
  Information Act, Privacy Act, Government in the Sunshine Act, Federal Advisory Committee
  Act, Negotiated Rulemaking Act, Regulatory Flexibility Act, Paperwork Reduction Act,
  Congressional Review of Agency Rulemaking, Equal Access to Justice Act, Contract Disputes
  Act, Administrative Dispute Resolution Act, E-Government Act of 2002, National
  Environmental Policy Act, Information Quality Act, Government Performance and Results
  Act, Federal Register Act, Agency Practice Act, Judicial Review of Agency Action,
  Rulemaking Requirements from the Executive Office of the President, and Tucker Act.
